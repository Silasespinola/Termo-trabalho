<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=League+Spartan:wght@100..900&family=Mitr:wght@200;300;400;500;600;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <i class="fa-solid fa-angle-up"></i>
            <i class="fa-solid fa-question"></i>
            <h1 class="title">Termo</h1>
            <i class="fa-solid fa-chart-simple"></i>
            <i class="fa-solid fa-gear"></i>
        </header>
        <main class="main-content">
            <div class="linha-1">
                <div class="square-empity" id="quadrado-vazio"></div>
                <div class="square-empity" id="quadrado-vazio-2"></div>
                <div class="square-empity" id="quadrado-vazio-3"></div>
                <div class="square-empity" id="quadrado-vazio-4"></div>
                <div class="square-empity" id="quadrado-vazio-5"></div>
            </div>

            <div class="linha-2">
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
            </div>

            <div class="linha-3">
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
            </div>

            <div class="linha-4">
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
            </div>

            <div class="linha-5">
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
            </div>

            <div class="linha-6">
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
                <div class="other-line"></div>
            </div>

        </main>
        <div class="keyboard">
            <div class="keyboard-line-1">
                <button class="btn">Q</button>
                <button class="btn">W</button>
                <button class="btn">E</button>
                <button class="btn">R</button>
                <button class="btn">T</button>
                <button class="btn">Y</button>
                <button class="btn">U</button>
                <button class="btn">I</button>
                <button class="btn">O</button>
                <button class="btn">P</button>
            </div>
            <div class="keyboard-line-2">
                <button class="btn">A</button>
                <button class="btn">S</button>
                <button class="btn">D</button>
                <button class="btn">F</button>
                <button class="btn">G</button>
                <button class="btn">H</button>
                <button class="btn">J</button>
                <button class="btn">K</button>
                <button class="btn">L</button>
                <button class="btn-delete"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div class="keyboard-line-3">
                <button class="btn">Z</button>
                <button class="btn">X</button>
                <button class="btn">C</button>
                <button class="btn">V</button>
                <button class="btn">B</button>
                <button class="btn">N</button>
                <button class="btn">M</button>
                <button class="btn-enter">ENTER</button>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>

</html>
